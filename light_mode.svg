<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="Karthik Subramanian — GitHub profile">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Iowan Old Style', serif; }
    .sans  { font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; }
    .name  { fill:#1F1D18; font-size:34px; letter-spacing:0.2px; }
    .role  { fill:#837D70; font-size:13.5px; }
    .klbl  { fill:#B0A99B; font-size:10px; letter-spacing:1.4px; }
    .kval  { fill:#1F1D18; font-size:13px; }
    .num   { fill:#1F1D18; font-size:26px; font-variant-numeric:tabular-nums; }
    .slbl  { fill:#D97757; font-size:10px; letter-spacing:1.4px; }
    .sval  { fill:#3B382F; font-size:13px; }
    .muted { fill:#837D70; font-size:11.5px; }
    .accent{ fill:#D97757; }

    .rocket { animation: drift 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flame  { animation: flicker 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    .star   { animation: twinkle 3.6s ease-in-out infinite; }
    .shoot  { animation: shoot 11s cubic-bezier(0.16,1,0.3,1) infinite; opacity:0; }
    @keyframes drift   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes flicker { 0%,100%{opacity:0.9; transform:scaleY(1)} 50%{opacity:0.55; transform:scaleY(0.82)} }
    @keyframes twinkle { 0%,100%{opacity:0.25} 50%{opacity:0.85} }
    @keyframes shoot   { 0%{opacity:0; transform:translate(0,0)} 3%{opacity:0.9} 14%{opacity:0.9} 22%,100%{opacity:0; transform:translate(150px,78px)} }
    @media (prefers-reduced-motion: reduce) {
      .rocket,.flame,.star,.shoot { animation: none; }
      .shoot { opacity:0; }
    }
  </style>

  <rect x="0" y="0" width="880" height="500" rx="22" fill="#F4F2EB"/>

  <!-- ════════ Left: animated space illustration ════════ -->
  <g class="accent">
    <circle class="star" cx="60" cy="74" r="1.7" style="animation-delay:0s"/>
    <circle class="star" cx="206" cy="116" r="1.5" style="animation-delay:1.1s"/>
    <circle class="star" cx="38" cy="250" r="1.5" style="animation-delay:0.5s"/>
    <circle class="star" cx="214" cy="300" r="1.9" style="animation-delay:2.0s"/>
    <circle class="star" cx="96" cy="402" r="1.5" style="animation-delay:1.6s"/>
    <circle class="star" cx="178" cy="40" r="1.3" style="animation-delay:2.6s"/>
    <circle class="star" cx="250" cy="200" r="1.4" style="animation-delay:0.9s"/>
    <circle class="star" cx="28" cy="150" r="1.3" style="animation-delay:3.0s"/>
  </g>
  <path class="accent star" style="animation-delay:0.7s" d="M168 150 C168 158 168 158 176 160 C168 162 168 162 168 170 C168 162 168 162 160 160 C168 158 168 158 168 150 Z"/>
  <path class="accent star" style="animation-delay:1.9s" d="M52 332 C52 338 52 338 58 340 C52 342 52 342 52 348 C52 342 52 342 46 340 C52 338 52 338 52 332 Z"/>

  <g class="shoot">
    <line x1="40" y1="60" x2="64" y2="72" stroke="#D97757" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="64" cy="72" r="1.8" fill="#D97757"/>
  </g>

  <!-- planet with ring -->
  <ellipse cx="120" cy="318" rx="92" ry="25" transform="rotate(-20 120 318)" fill="none" stroke="#1F1D18" stroke-width="2" opacity="0.85"/>
  <circle cx="120" cy="318" r="50" fill="#D97757"/>
  <path d="M83 284 a50 50 0 0 0 17 65 q22 -36 -17 -65 Z" fill="#1F1D18" opacity="0.12"/>
  <ellipse cx="120" cy="318" rx="92" ry="25" transform="rotate(-20 120 318)" fill="none" stroke="#1F1D18" stroke-width="2" opacity="0.85" stroke-dasharray="150 420"/>

  <!-- rocket -->
  <g class="rocket">
    <path d="M120 120 C108 134 104 154 104 182 L104 200 C104 212 136 212 136 200 L136 182 C136 154 132 134 120 120 Z" fill="#1F1D18"/>
    <path d="M104 186 L90 214 L104 206 Z" fill="#D97757"/>
    <path d="M136 186 L150 214 L136 206 Z" fill="#D97757"/>
    <path class="flame" d="M120 208 C128 219 126 235 120 242 C114 235 112 219 120 208 Z" fill="#D97757"/>
    <circle cx="120" cy="164" r="9" fill="#F4F2EB" stroke="#D97757" stroke-width="2.5"/>
  </g>

  <!-- ════════ Right: content ════════ -->
  <text class="serif name" x="288" y="94">Karthik Subramanian</text>
  <text class="sans role" x="290" y="117">EECS @ UC Berkeley<tspan fill="#837D70">  ·  </tspan><tspan class="accent">Regents' Scholar</tspan><tspan fill="#837D70">  ·  founder · engineer · researcher</tspan></text>

  <line x1="290" y1="135" x2="850" y2="135" stroke="#E5E1D6" stroke-width="1.5"/>

  <!-- live telemetry -->
  <text class="sans klbl" x="290" y="164">AGE</text>
  <text class="sans kval" id="age_data" x="372" y="165">19 years, 0 months, 10 days</text>
  <text class="sans klbl" x="290" y="187">WEATHER</text>
  <text class="sans kval" id="weather_data" x="372" y="188">🌤️ 58°F · mainly clear</text>

  <!-- stat band -->
  <text class="serif num" id="commit_data" x="290" y="240">954</text>
  <text class="sans klbl" x="291" y="258">COMMITS</text>
  <text class="serif num" id="star_data" x="406" y="240">0</text>
  <text class="sans klbl" x="407" y="258">STARS</text>
  <text class="serif num" id="repo_data" x="522" y="240">35</text>
  <text class="sans klbl" x="523" y="258">REPOS</text>
  <text class="serif num" id="years_data" x="638" y="240">4</text>
  <text class="sans klbl" x="639" y="258">ON GITHUB</text>

  <line x1="290" y1="284" x2="850" y2="284" stroke="#E5E1D6" stroke-width="1.5"/>

  <!-- stack (curated highlights; full stack lives on the site) -->
  <text class="sans slbl" x="290" y="312">LANGUAGES</text>
  <text class="sans sval" x="410" y="312">Python · Java · TypeScript · C++ · SQL</text>
  <text class="sans slbl" x="290" y="336">FRAMEWORKS</text>
  <text class="sans sval" x="410" y="336">React · Next.js · FastAPI · PyTorch · Svelte</text>
  <text class="sans slbl" x="290" y="360">SYSTEMS</text>
  <text class="sans sval" x="410" y="360">CUDA · AWS · Docker · Redis · OpenTelemetry</text>
  <text class="sans slbl" x="290" y="384">HARDWARE</text>
  <text class="sans sval" x="410" y="384">roboRIO · STM32 · Arduino · Raspberry Pi · FPGA</text>

  <!-- footer -->
  <text class="sans muted" x="290" y="416">Writing · Stargazing · Philosophy · Board Games · Travel</text>
  <text class="sans slbl" x="290" y="442">EMAIL</text>
  <text class="sans sval" x="372" y="442" font-size="12px">karthik [dot] subramanian [at] berkeley [dot] edu</text>
  <text class="sans slbl" x="290" y="462">LINKS</text>
  <text class="sans sval" x="372" y="462" font-size="12px">/in/karthik-subramanian-07 · @winner.karthik · karthik07</text>
</svg>