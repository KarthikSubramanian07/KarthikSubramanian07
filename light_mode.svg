<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="870" height="500" viewBox="0 0 870 500" role="img" aria-label="karthik subramanian — GitHub profile">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', 'Iowan Old Style', serif; }
    .sans  { font-family: 'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif; }
    .name  { fill:#1A1916; font-size:34px; letter-spacing:0.2px; }
    .role  { fill:#6E6A60; font-size:13.5px; }
    .klbl  { fill:#9A9488; font-size:10px; letter-spacing:1.4px; }
    .kval  { fill:#1A1916; font-size:13px; }
    .num   { fill:#1A1916; font-size:26px; font-variant-numeric:tabular-nums; }
    .slbl  { fill:#D97757; font-size:10px; letter-spacing:1.4px; }
    .sval  { fill:#34322B; font-size:12px; }
    .muted { fill:#6E6A60; font-size:11.5px; }
    .accent{ fill:#D97757; }

    .rocket { animation: drift 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flame  { animation: flicker 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    .star   { animation: twinkle 3.6s ease-in-out infinite; }
    .shoot  { animation: shoot 11s cubic-bezier(0.16,1,0.3,1) infinite; opacity:0; }
    @keyframes drift   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes flicker { 0%,100%{opacity:0.9; transform:scaleY(1)} 50%{opacity:0.55; transform:scaleY(0.82)} }
    @keyframes twinkle { 0%,100%{opacity:0.25} 50%{opacity:0.85} }
    @keyframes shoot   { 0%{opacity:0; transform:translate(0,0)} 3%{opacity:0.9} 14%{opacity:0.9} 22%,100%{opacity:0; transform:translate(150px,78px)} }
    @media (prefers-reduced-motion: reduce) {
      .rocket,.flame,.star,.shoot { animation: none; }
      .shoot { opacity:0; }
    }
  </style>

  <rect x="0" y="0" width="870" height="500" rx="22" fill="#FAF9F6"/>

